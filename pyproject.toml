[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qvm-decompiler"
version = "0.1.0"
description = "Experimental Quake III VM bytecode inspector and pseudocode generator"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
qvm-decompiler = "qvm_decompiler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
